<!doctype html>
<html><head><meta charset="utf-8"><title>Workout Log</title>
<style>
@page { size: letter portrait; margin: 0.4in; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Helvetica Neue", Arial, sans-serif; color: #111; width: 7.7in; }
.top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #111; padding-bottom: 6px; }
h1 { font-size: 18pt; letter-spacing: 3px; font-weight: 800; }
h1 span { display: inline-block; width: 18px; height: 18px; border: 3px solid #111; margin-right: 8px; vertical-align: -1px; }
.fields { display: flex; gap: 10px; margin-top: 8px; }
.f { flex: 1; font-size: 6.5pt; font-weight: 700; letter-spacing: 1px; color: #555; }
.f div { border-bottom: 1px solid #111; height: 18px; }
.f.wide { flex: 2; }
.ex { margin-top: 6px; border: 1.5px solid #111; }
.head { display: flex; background: #1a1a1a; color: #fff; font-size: 6.5pt; font-weight: 700; letter-spacing: 1px; }
.head div { padding: 2px 6px; }
.name-row { display: flex; height: 0.28in; border-bottom: 1px solid #111; }
.name-row .n { flex: 1; border-right: 1px solid #111; }
.name-row .w { width: 1.6in; position: relative; }
.name-row .w::after { content: "LBS / KG"; position: absolute; right: 4px; bottom: 2px; font-size: 5.5pt; color: #999; }
.set { display: flex; align-items: center; height: 0.19in; border-bottom: 1px solid #ccc; padding: 0 6px; }
.set:last-child { border-bottom: none; }
.lbl { width: 0.45in; font-size: 6.5pt; font-weight: 700; letter-spacing: 1px; }
.boxes { display: flex; gap: 2px; flex: 1; }
.boxes i { width: 0.14in; height: 0.14in; border: 1px solid #555; }
.boxes i:nth-child(5n) { margin-right: 4px; }
.tot { width: 0.55in; height: 0.16in; border: 1.5px solid #111; position: relative; }
.tot::before { content: "REPS"; position: absolute; left: -26px; top: 1px; font-size: 5.5pt; color: #777; font-weight: 700; }
.notes { margin-top: 6px; border: 1.5px solid #111; height: 0.45in; padding: 2px 6px; font-size: 6.5pt; font-weight: 700; letter-spacing: 1px; color: #555; }
</style></head><body>
<div class="top"><h1><span></span>WORKOUT LOG</h1><div style="font-size:7pt;font-weight:700;letter-spacing:1px;color:#555">WEEK OF ______________</div></div>
<div class="fields">
  <div class="f">DATE<div></div></div><div class="f">START<div></div></div><div class="f">END<div></div></div>
  <div class="f wide">FOCUS / MUSCLE GROUP<div></div></div><div class="f">BODY WT<div></div></div>
</div>
<div id="ex"></div>
<div class="notes">NOTES</div>
<script>
const EX = 7, SETS = 4, BOXES = 30;
let html = '';
for (let e = 1; e <= EX; e++) {
  html += `<div class="ex"><div class="head"><div style="flex:1">WORKOUT NAME</div><div style="width:1.6in">WEIGHT</div></div>
  <div class="name-row"><div class="n"></div><div class="w"></div></div>`;
  for (let s = 1; s <= SETS; s++) {
    html += `<div class="set"><div class="lbl">SET ${s}</div><div class="boxes">${'<i></i>'.repeat(BOXES)}</div><div class="tot"></div></div>`;
  }
  html += '</div>';
}
document.getElementById('ex').innerHTML = html;
</script>
</body></html>
